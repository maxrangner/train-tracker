<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Train map</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ink: #1b1f24;
      --muted: #59636e;
      --card: rgba(255, 255, 255, 0.94);
      --line: #d8dee4;
      --accent: #1f6feb;
      --late: #a40e26;
      --gap: 10px;
    }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body { font: 13px/1.35 system-ui, sans-serif; color: var(--ink); }
    #map { position: fixed; inset: 0; }

    .card {
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }
    #top {
      position: fixed;
      left: calc(var(--gap) + env(safe-area-inset-left, 0px));
      right: calc(var(--gap) + env(safe-area-inset-right, 0px));
      top: calc(var(--gap) + env(safe-area-inset-top, 0px));
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-start;
      pointer-events: none;
    }
    #top > * { pointer-events: auto; }
    #status { padding: 6px 10px; font-variant-numeric: tabular-nums; }
    #status.problem { color: var(--late); }
    #rail, .tilt-card { display: flex; padding: 3px; gap: 2px; }
    #rail button, #tilt {
      font: inherit;
      border: 0;
      border-radius: 6px;
      padding: 4px 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    #rail button[aria-pressed="true"], #tilt[aria-pressed="true"] { background: var(--accent); color: #fff; }
    #rail button:focus-visible, #tilt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* The menu: the ☰ button opens a panel under the top bar. */
    #menu-button { border: 0; padding: 5px 8px; display: grid; place-items: center; color: var(--ink); cursor: pointer; }
    #menu-button[aria-expanded="true"] { background: var(--accent); color: #fff; }
    #menu-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    #menu {
      position: fixed;
      left: calc(var(--gap) + env(safe-area-inset-left, 0px));
      top: calc(var(--gap) + 40px + env(safe-area-inset-top, 0px));
      width: min(420px, calc(100% - 2 * var(--gap) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
      max-height: calc(100% - 70px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      overflow: auto; background: #fff; padding: 10px 12px; box-sizing: border-box; z-index: 5;
      display: flex; flex-direction: column; gap: 10px;
    }
    .menu-head { display: flex; gap: 6px; align-items: center; }
    #search { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
    #search:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    .menu-close { font: inherit; font-size: 22px; line-height: 1; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px 6px; }
    #search-results { list-style: none; margin: 0; padding: 0; display: grid; }
    #search-results:empty { display: none; }
    #search-results button {
      width: 100%; text-align: left; font: inherit; font-size: 15px; padding: 9px 6px; border: 0; border-bottom: 1px solid var(--line);
      background: transparent; color: var(--ink); cursor: pointer; display: flex; gap: 8px; align-items: baseline;
    }
    #search-results button span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #search-results button:hover, #search-results button:focus-visible { background: #f0f4fa; outline: none; }
    .menu-note { color: var(--muted); padding: 8px 6px; }
    .menu-text { margin: 0; color: var(--ink); }
    .menu-section { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
    .menu-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    #rail { display: flex; flex-wrap: wrap; gap: 4px; }
    #menu #rail button { font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); }
    /* leave room on the right for the zoom buttons and compass */
    #top { right: calc(56px + env(safe-area-inset-right, 0px)); }

    /* The selected train: a ring with its dot (hidden from zoom 13, where the 3D train shows) and its label. */
    .sel-train { width: 22px; height: 22px; border: 2.5px solid var(--ink); border-radius: 50%; box-sizing: border-box;
      display: grid; place-items: center; pointer-events: none; }
    .sel-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #fff; background: #8c959f; }
    .sel-train.model .sel-dot { display: none; }
    .sel-train.late-ontime .sel-dot { background: #1a7f37; }
    .sel-train.late-some .sel-dot { background: #d4a72c; }
    .sel-train.late-late .sel-dot { background: #d1242f; }
    .sel-train.late-stale { opacity: 0.45; }
    .sel-label { position: absolute; top: calc(100% + 2px); left: 50%; transform: translateX(-50%); white-space: pre; text-align: center;
      font: 700 11px 'Noto Sans', system-ui, sans-serif; color: var(--ink);
      text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; }

    #panel {
      position: fixed;
      left: calc(var(--gap) + env(safe-area-inset-left, 0px));
      bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px));
      width: min(420px, calc(100% - 2 * var(--gap) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
      max-height: 45vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      box-sizing: border-box;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; }
    .panel-buttons { display: flex; align-items: center; gap: 4px; }
    .panel-follow {
      font: inherit; font-size: 13px;
      border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px;
      background: #fff; color: var(--muted); cursor: pointer;
    }
    .panel-follow[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .panel-close {
      font: inherit; font-size: 20px; line-height: 1;
      border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px 6px;
    }
    .panel-note { margin: 4px 0 6px; color: var(--muted); }
    .panel-status { margin: 4px 0 0; color: var(--late); }
    .panel-table { overflow: auto; min-height: 0; position: relative; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th { text-align: left; font-weight: 600; color: var(--muted); position: sticky; top: 0; background: #fff; }
    th, td { padding: 3px 6px 3px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td.st { white-space: normal; }
    tr.passed td { color: var(--muted); }
    tr.next td { font-weight: 600; }
    tr.canceled td { color: var(--late); text-decoration: line-through; }
    td.dev { color: var(--late); text-align: right; }
    .est { color: var(--muted); font-weight: 400; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="top">
    <button id="menu-button" class="card" type="button" aria-expanded="false" aria-controls="menu" aria-label="Menu and search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div id="status" class="card">connecting…</div>
    <div class="card tilt-card"><button id="tilt" type="button" aria-pressed="false">Tilt</button></div>
  </div>
  <div id="menu" class="card" hidden>
    <div class="menu-head">
      <input id="search" type="search" placeholder="Train number or station" autocomplete="off" autocorrect="off"
        spellcheck="false" enterkeyhint="search" aria-label="Search for a train number or a station">
      <button class="menu-close" type="button" aria-label="Close the menu">×</button>
    </div>
    <ul id="search-results" aria-live="polite"></ul>
    <div class="menu-section">
      <div class="menu-label">Live data</div>
      <p id="status-full" class="menu-text">connecting…</p>
    </div>
    <div class="menu-section">
      <div class="menu-label">Rail lines</div>
      <div id="rail" role="group" aria-label="Rail lines"></div>
    </div>
  </div>
  <div id="panel" class="card" hidden></div>
  <script>
    // Show any error on screen (phones have no console to look at), and say so if the program never starts.
    (function () {
      var shown = false;
      function show(text) {
        var el = document.getElementById('status');
        if (!el) return;
        el.textContent = 'Error: ' + text;
        el.classList.add('problem');
        el.style.whiteSpace = 'normal';
        shown = true;
      }
      window.addEventListener('error', function (e) {
        show((e.message || 'a file failed to load') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () {
        var el = document.getElementById('status');
        if (!shown && el && el.textContent.indexOf('connecting') === 0 && !window.__started)
          show('the page\'s program did not start within 20 s');
      }, 20000);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
