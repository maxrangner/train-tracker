<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Train map</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ink: #1b1f24;
      --muted: #59636e;
      --card: rgba(255, 255, 255, 0.94);
      --line: #d8dee4;
      --accent: #1f6feb;
      --late: #a40e26;
      --gap: 10px;
    }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body { font: 13px/1.35 system-ui, sans-serif; color: var(--ink); }
    #map { position: fixed; inset: 0; }

    .card {
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }
    #top {
      position: fixed;
      left: calc(var(--gap) + env(safe-area-inset-left, 0px));
      right: calc(var(--gap) + env(safe-area-inset-right, 0px));
      top: calc(var(--gap) + env(safe-area-inset-top, 0px));
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-start;
      pointer-events: none;
    }
    #top > * { pointer-events: auto; }
    #status { padding: 6px 10px; font-variant-numeric: tabular-nums; }
    #status.problem { color: var(--late); }
    #rail, .tilt-card { display: flex; padding: 3px; gap: 2px; }
    #rail button, #tilt {
      font: inherit;
      border: 0;
      border-radius: 6px;
      padding: 4px 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    #rail button[aria-pressed="true"], #tilt[aria-pressed="true"] { background: var(--accent); color: #fff; }
    #rail button:focus-visible, #tilt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* leave room on the right for the zoom buttons and compass */
    #top { right: calc(56px + env(safe-area-inset-right, 0px)); }

    #panel {
      position: fixed;
      left: calc(var(--gap) + env(safe-area-inset-left, 0px));
      bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px));
      width: min(420px, calc(100% - 2 * var(--gap) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
      max-height: 45vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      box-sizing: border-box;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; }
    .panel-buttons { display: flex; align-items: center; gap: 4px; }
    .panel-follow {
      font: inherit; font-size: 13px;
      border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px;
      background: #fff; color: var(--muted); cursor: pointer;
    }
    .panel-follow[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .panel-close {
      font: inherit; font-size: 20px; line-height: 1;
      border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px 6px;
    }
    .panel-note { margin: 4px 0 6px; color: var(--muted); }
    .panel-status { margin: 4px 0 0; color: var(--late); }
    .panel-table { overflow: auto; min-height: 0; position: relative; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th { text-align: left; font-weight: 600; color: var(--muted); position: sticky; top: 0; background: #fff; }
    th, td { padding: 3px 6px 3px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td.st { white-space: normal; }
    tr.passed td { color: var(--muted); }
    tr.next td { font-weight: 600; }
    tr.canceled td { color: var(--late); text-decoration: line-through; }
    td.dev { color: var(--late); text-align: right; }
    .est { color: var(--muted); font-weight: 400; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="top">
    <div id="status" class="card">connecting…</div>
    <div id="rail" class="card" role="group" aria-label="Rail lines"></div>
    <div class="card tilt-card"><button id="tilt" type="button" aria-pressed="false">Tilt</button></div>
  </div>
  <div id="panel" class="card" hidden></div>
  <script>
    // Show any error on screen (phones have no console to look at), and say so if the program never starts.
    (function () {
      var shown = false;
      function show(text) {
        var el = document.getElementById('status');
        if (!el) return;
        el.textContent = 'Error: ' + text;
        el.classList.add('problem');
        el.style.whiteSpace = 'normal';
        shown = true;
      }
      window.addEventListener('error', function (e) {
        show((e.message || 'a file failed to load') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () {
        var el = document.getElementById('status');
        if (!shown && el && el.textContent.indexOf('connecting') === 0 && !window.__started)
          show('the page\'s program did not start within 20 s');
      }, 20000);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
